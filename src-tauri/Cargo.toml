[package]
name = "lissecurity"
description = "LisSecurity — cofre pessoal de senhas e dados bancários"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# No Android a app é uma biblioteca (.so) carregada pela Activity; no computador, o binário
# `lissecurity` só chama `lissecurity_lib::run()`.
[lib]
name = "lissecurity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lissecurity-core = { path = "../core" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["serde"] }
sha2 = "0.10.9"
base64 = "0.22"

# Só no computador: janelas de ficheiros, instância única, arranque com o sistema, navegador e
# área de transferência. No Android estas funções são da camada Kotlin (gen/android).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
arboard = { version = "3.7", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
] }
