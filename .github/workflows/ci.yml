# LisSecurity: testes do núcleo e da interface, teste ponta-a-ponta da app real (Linux),
# instalador para Windows (NSIS) e, quando pedido, a Release com o instalador e o SHA-256.
name: LisSecurity

on:
  push:
    # com "tags" definido, os ramos têm de ser listados também (senão deixam de disparar)
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (núcleo, interface e app real)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Dependências do sistema (WebKitGTK, WebDriver, ecrã virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev webkit2gtk-driver xvfb xclip
      - name: Núcleo criptográfico (cargo test)
        run: cargo test -p lissecurity-core
      - name: Camada nativa (cargo test)
        run: cargo test -p lissecurity
      - run: npm ci
      - name: Validações da interface (vitest)
        run: npm test
      - name: App de teste (debug, com a interface embutida)
        run: npx tauri build --debug --no-bundle
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Teste ponta-a-ponta na app real
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          CAPTURAS: ${{ runner.temp }}/capturas
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node e2e/teste.mjs
      - name: Capturas do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Núcleo criptográfico no Windows (cargo test)
        run: cargo test -p lissecurity-core
      - run: npm ci
      - name: Compilar e empacotar (NSIS)
        run: npx tauri build
      - name: Publicar o instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LisSecurity-Windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Publica a Release da versão em src-tauri/tauri.conf.json, depois de tudo passar, quando:
  #  - se envia uma etiqueta vX.Y.Z, ou
  #  - um commit no main traz "[publicar-release]" na mensagem (a etiqueta é criada aqui).
  release:
    name: Publicar Release
    needs: [testes, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publicar-release]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - name: Versão
        id: versao
        run: echo "versao=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: LisSecurity-Windows
          path: instalador
      - name: SHA-256 do instalador
        id: hash
        working-directory: instalador
        run: |
          ficheiro=$(ls *.exe)
          echo "ficheiro=$ficheiro" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$ficheiro" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: LisSecurity ${{ steps.versao.outputs.versao }}
          files: instalador/*.exe
          make_latest: true
          body: |
            ## Instalar

            1. Descarrega **`${{ steps.hash.outputs.ficheiro }}`** (em *Assets*, mais abaixo) e abre-o. Instala só para o teu utilizador, sem pedir administrador.
            2. O instalador ainda não tem assinatura de código: no aviso do SmartScreen escolhe **Mais informações → Executar mesmo assim**.
            3. Abre o LisSecurity, cria a tua senha mestra e guarda a chave de recuperação num sítio seguro.

            **SHA-256** `${{ steps.hash.outputs.sha }}`
            Para confirmar no PowerShell: `Get-FileHash .\${{ steps.hash.outputs.ficheiro }}`

            Compilado pelo GitHub Actions a partir do commit ${{ github.sha }}, depois de passarem os testes do núcleo, da interface e o teste ponta-a-ponta na app real.
            Antes de guardares dados importantes, lê a [nota de segurança](https://github.com/${{ github.repository }}/blob/main/docs/SEGURANCA.md).
