# LisSecurity: testes do núcleo e da interface, teste ponta-a-ponta da app real (Linux e
# emulador Android), instalador para Windows (NSIS), APK para Android e, quando pedido, a
# Release com os dois ficheiros e o SHA-256 de cada um.
name: LisSecurity

on:
  push:
    # com "tags" definido, os ramos têm de ser listados também (senão deixam de disparar)
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (núcleo, interface e app real)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Dependências do sistema (WebKitGTK, WebDriver, ecrã virtual)
        # um espelho do apt lento já prendeu este passo 25 min: limite de tempo e novas tentativas
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev webkit2gtk-driver xvfb xclip
      - name: Núcleo criptográfico (cargo test)
        run: cargo test -p lissecurity-core
      - name: Camada nativa (cargo test)
        run: cargo test -p lissecurity
      - run: npm ci
      - name: Validações da interface (vitest)
        run: npm test
      - name: App de teste (debug, com a interface embutida)
        run: npx tauri build --debug --no-bundle
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Teste ponta-a-ponta na app real
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          CAPTURAS: ${{ runner.temp }}/capturas
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node e2e/teste.mjs
      - name: Capturas do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: ${{ runner.temp }}/capturas
          if-no-files-found: ignore

  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Núcleo criptográfico no Windows (cargo test)
        run: cargo test -p lissecurity-core
      - run: npm ci
      - name: Compilar e empacotar (NSIS)
        run: npx tauri build
      - name: Publicar o instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LisSecurity-Windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: App Android (APK e teste no emulador)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      assinado: ${{ steps.publicar.outputs.assinado }}
    env:
      NDK_VERSAO: 28.2.13676358
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK do Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSAO" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSAO" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Núcleo criptográfico (cargo test)
        run: cargo test -p lissecurity-core
      # Mesma configuração da versão publicada (R8, sem permissão de internet), mais o DevTools
      # do WebView, que só existe neste APK de teste (é por ele que o teste conduz a interface).
      - name: APK de teste (x86_64, para o emulador)
        env:
          ORG_GRADLE_PROJECT_depurarWebView: "true"
        run: |
          npx tauri android build --target x86_64 --apk
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$RUNNER_TEMP/teste.apk"
      # os daemons do Gradle e do Kotlin ficam com ~2 GB cada depois da compilação: o emulador
      # precisa dessa memória (sem ela, o sistema pode matá-lo a meio do teste)
      - name: Libertar memória para o emulador
        run: |
          (cd src-tauri/gen/android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          free -m
          df -h /
      - name: Ativar a aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Teste ponta-a-ponta no emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURAS: ${{ runner.temp }}/capturas-android
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r "$RUNNER_TEMP/teste.apk"
            node e2e/android.mjs
      - name: Diagnóstico do anfitrião (se o teste no emulador falhar)
        if: failure()
        run: |
          free -m
          df -h /
          sudo dmesg -T | grep -iE "killed process|out of memory|oom" | tail -20 || true
      - name: Capturas do teste no Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-android
          path: ${{ runner.temp }}/capturas-android
          if-no-files-found: ignore
      # A chave de assinatura vem dos segredos do repositório (nunca do código). Sem ela, o APK
      # fica assinado com uma chave de depuração descartável: serve para experimentar, mas não
      # vai para a Release (não atualizaria uma instalação feita com a chave verdadeira).
      - name: APK para publicar (arm64)
        id: publicar
        env:
          CHAVE_B64: ${{ secrets.LISSECURITY_KEYSTORE_B64 }}
          LISSECURITY_KEYSTORE_SENHA: ${{ secrets.LISSECURITY_KEYSTORE_SENHA }}
          LISSECURITY_CHAVE_ALIAS: ${{ secrets.LISSECURITY_CHAVE_ALIAS }}
          LISSECURITY_CHAVE_SENHA: ${{ secrets.LISSECURITY_CHAVE_SENHA }}
        run: |
          if [ -n "$CHAVE_B64" ]; then
            echo "$CHAVE_B64" | base64 -d > "$RUNNER_TEMP/lissecurity.jks"
            export LISSECURITY_KEYSTORE="$RUNNER_TEMP/lissecurity.jks"
            echo "assinado=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem LISSECURITY_KEYSTORE_B64: o APK fica assinado com uma chave de depuração e não entra na Release."
            echo "assinado=false" >> "$GITHUB_OUTPUT"
          fi
          npx tauri android build --target aarch64 --apk
          versao=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p apk
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "apk/LisSecurity-$versao-android.apk"
          rm -f "$RUNNER_TEMP/lissecurity.jks"
      - name: Confirmar o APK (sem internet, assinatura)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump permissions apk/*.apk | tee permissoes.txt
          if grep -q "android.permission.INTERNET" permissoes.txt; then echo "::error::O APK pede acesso à internet"; exit 1; fi
          "$BT/apksigner" verify --print-certs apk/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
      - name: Publicar o APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LisSecurity-Android
          path: apk/*.apk
          if-no-files-found: error

  # Publica a Release da versão em src-tauri/tauri.conf.json, depois de tudo passar, quando:
  #  - se envia uma etiqueta vX.Y.Z, ou
  #  - um commit no main traz "[publicar-release]" na mensagem (a etiqueta é criada aqui).
  release:
    name: Publicar Release
    needs: [testes, windows, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publicar-release]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - name: Versão
        id: versao
        run: echo "versao=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: LisSecurity-Windows
          path: instalador
      - name: SHA-256 do instalador
        id: hash
        working-directory: instalador
        run: |
          ficheiro=$(ls *.exe)
          echo "ficheiro=$ficheiro" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$ficheiro" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: needs.android.outputs.assinado == 'true'
        with:
          name: LisSecurity-Android
          path: instalador
      - name: SHA-256 do APK e texto da secção Android
        id: android
        working-directory: instalador
        env:
          ASSINADO: ${{ needs.android.outputs.assinado }}
        run: |
          if [ "$ASSINADO" = "true" ]; then
            apk=$(ls *.apk)
            sha=$(sha256sum "$apk" | cut -d' ' -f1)
            {
              echo "texto<<FIM"
              echo "### Android (7 ou mais recente, 64 bits)"
              echo
              echo "1. No telemóvel, descarrega **\`$apk\`** e abre-o. O Android pede para autorizar a instalação a partir do navegador ou da app de ficheiros — é o normal para apps fora da Play Store."
              echo "2. Abre o LisSecurity, cria a tua senha mestra (ou restaura uma cópia \`.lissec\` do PC) e, se quiseres, liga o desbloqueio com a impressão digital nas Definições."
              echo
              echo "**SHA-256** \`$sha\`"
              echo "FIM"
            } >> "$GITHUB_OUTPUT"
          else
            echo "texto=" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: LisSecurity ${{ steps.versao.outputs.versao }}
          files: |
            instalador/*.exe
            instalador/*.apk
          fail_on_unmatched_files: false
          make_latest: true
          body: |
            ## Instalar

            ### Windows

            1. Descarrega **`${{ steps.hash.outputs.ficheiro }}`** (em *Assets*, mais abaixo) e abre-o. Instala só para o teu utilizador, sem pedir administrador.
            2. O instalador ainda não tem assinatura de código: no aviso do SmartScreen escolhe **Mais informações → Executar mesmo assim**.
            3. Abre o LisSecurity, cria a tua senha mestra e guarda a chave de recuperação num sítio seguro.

            **SHA-256** `${{ steps.hash.outputs.sha }}`
            Para confirmar no PowerShell: `Get-FileHash .\${{ steps.hash.outputs.ficheiro }}`

            ${{ steps.android.outputs.texto }}

            Compilado pelo GitHub Actions a partir do commit ${{ github.sha }}, depois de passarem os testes do núcleo, da interface e os testes ponta-a-ponta na app real (Linux e emulador Android).
            Antes de guardares dados importantes, lê a [nota de segurança](https://github.com/${{ github.repository }}/blob/main/docs/SEGURANCA.md).
